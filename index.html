<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- PREVIEW:HEAD-START -->
<title>Speak the Word</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Lexend:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  /* Layout: phone-first app shell. Sticky header, bottom tab bar under 900px, left rail above.
     Each lesson station is a leaded-glass roundel on a zigzag path; surfaces carry a lead outline + hard shadow. */
  --bg:#ECEFF8;
  --lattice:rgba(20,26,58,.055);
  --surface:#FFFFFF;
  --surface-2:#F3F5FC;
  --text:#141A3A;
  --muted:#565E7E;
  --lead:#141A3A;
  --on-gold:#141A3A;
  --cobalt:#2747C9; --cobalt-2:#8EA3FF;
  --ruby:#C4244A;   --ruby-2:#F590A6;
  --gold:#F2B400;   --gold-2:#FFE07A;
  --emerald:#0A845B; --emerald-2:#74DBB3;
  --sky:#1A86CC;    --sky-2:#9AD8FF;
  --violet:#6935BE; --violet-2:#C3A7F7;
  --stone:#A3A8BD;  --stone-2:#D3D6E3;
  --good:#0A845B; --good-bg:#DCF4E9; --on-good:#FFFFFF;
  --bad:#C4244A;  --bad-bg:#FCE3E9; --on-bad:#FFFFFF;
  --f-display:"Alfa Slab One","Rockwell","Roboto Slab",Georgia,serif;
  --f-body:"Lexend","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F2B; --lattice:rgba(150,170,255,.055); --surface:#161C47; --surface-2:#1E2559;
    --text:#EDF0FF; --muted:#A8AFD6; --lead:#02041A;
    --cobalt:#5D7BFF; --cobalt-2:#2A3DA3; --ruby:#FF4F76; --ruby-2:#8E1C3A; --gold:#FFC738; --gold-2:#9A7000;
    --emerald:#2CC98F; --emerald-2:#0C6447; --sky:#4CB4FF; --sky-2:#145A8C; --violet:#A47DFF; --violet-2:#4A2893;
    --stone:#4A5075; --stone-2:#2C3156; --good:#3BD9A0; --good-bg:#0E392C; --on-good:#04231A; --bad:#FF6B8C; --bad-bg:#45152A; --on-bad:#2A0712;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F2B; --lattice:rgba(150,170,255,.055); --surface:#161C47; --surface-2:#1E2559;
  --text:#EDF0FF; --muted:#A8AFD6; --lead:#02041A;
  --cobalt:#5D7BFF; --cobalt-2:#2A3DA3; --ruby:#FF4F76; --ruby-2:#8E1C3A; --gold:#FFC738; --gold-2:#9A7000;
  --emerald:#2CC98F; --emerald-2:#0C6447; --sky:#4CB4FF; --sky-2:#145A8C; --violet:#A47DFF; --violet-2:#4A2893;
  --stone:#4A5075; --stone-2:#2C3156; --good:#3BD9A0; --good-bg:#0E392C; --on-good:#04231A; --bad:#FF6B8C; --bad-bg:#45152A; --on-bad:#2A0712;
  color-scheme:dark;
}

html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-color:var(--bg);
  background-image:repeating-linear-gradient(60deg,var(--lattice) 0 1.5px,transparent 1.5px 38px),repeating-linear-gradient(-60deg,var(--lattice) 0 1.5px,transparent 1.5px 38px);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.ic{flex:none;display:inline-block;vertical-align:-0.18em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border:2px solid var(--lead);border-radius:14px;background:var(--surface);color:var(--text);font-weight:600;font-size:1rem;box-shadow:3px 3px 0 var(--lead);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--lead)}
.btn.primary{background:var(--cobalt);color:#fff}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.good{background:var(--good);color:var(--on-good)}
.btn.danger{background:var(--ruby);color:#fff}
.btn.wide{width:100%;max-width:420px}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;padding:8px 10px;color:var(--muted);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--lead);background:var(--surface);box-shadow:2px 2px 0 var(--lead);flex:none}
.iconbtn:active{transform:translate(2px,2px);box-shadow:none}
.tool{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border:2px solid var(--lead);border-radius:999px;background:var(--surface-2);font-weight:600;font-size:.88rem}
.tool:active{transform:translateY(1px)}
a.tool{text-decoration:none;color:var(--text)}
.card{background:var(--surface);border:2px solid var(--lead);border-radius:18px;box-shadow:4px 4px 0 var(--lead)}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.tab-num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:2px solid var(--lead);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-name{font-family:var(--f-display);font-size:1.15rem;line-height:1;white-space:nowrap}
.hstats{margin-left:auto;display:flex;align-items:center;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 10px;border:2px solid var(--lead);border-radius:999px;background:var(--surface-2);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.hchip small{font-size:.7rem;font-weight:700;color:var(--muted)}
.hchip.fire{color:var(--ruby)}
.hchip.cold{color:var(--muted)}
.hchip.eday{background:var(--gold);color:var(--on-gold);font-size:.8rem}
.ring{display:grid;place-items:center;width:38px;height:38px}
.ring-bg{fill:none;stroke:var(--stone-2);stroke-width:4}
.ring-fg{fill:none;stroke:var(--emerald);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .6s}
.xp-pop{position:fixed;z-index:95;top:calc(56px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));font-family:var(--f-display);font-size:1.3rem;color:var(--gold);-webkit-text-stroke:1px var(--lead);pointer-events:none;animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-26px)}}
@media (max-width:420px){.brand-name{display:none}.hchip{padding:0 8px}}

/* ---------- shell ---------- */
main{display:block;max-width:1120px;margin:0 auto;padding-block:18px calc(100px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));outline:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:2px solid var(--lead);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;background:none;border:0;color:var(--muted);font-weight:600;font-size:.72rem;line-height:1.1}
.tab[aria-current="page"]{color:var(--cobalt)}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:210px minmax(0,1fr);max-width:1340px;margin:0 auto}
  .tabs{position:sticky;top:calc(70px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:22px 0 22px max(16px,env(safe-area-inset-left,0px))}
  .tab{flex-direction:row;gap:12px;padding:11px 14px;border:2px solid transparent;border-radius:14px;font-size:.98rem;color:var(--text)}
  .tab:hover{background:var(--surface-2)}
  .tab[aria-current="page"]{background:var(--surface);border-color:var(--lead);box-shadow:3px 3px 0 var(--lead);color:var(--text)}
  .tab[aria-current="page"] .ic{color:var(--cobalt)}
  main{padding-bottom:48px}
}

/* ---------- learn ---------- */
.learn{display:grid;gap:22px}
.learn-main{display:flex;flex-direction:column;gap:18px;min-width:0}
.learn-side{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (min-width:1100px){.learn{grid-template-columns:minmax(0,1fr) 330px;align-items:start}.learn-side{position:sticky;top:86px}}
.weekbar{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 8px 2px;scrollbar-width:thin}
.wchip{flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border:2px solid var(--lead);border-radius:999px;background:var(--surface);font-weight:600;font-size:.9rem;box-shadow:2px 2px 0 var(--lead)}
.wchip[aria-selected="true"]{background:var(--cobalt);color:#fff}
.wchip.locked{color:var(--muted);box-shadow:none;border-style:dashed}
.wchip.done .ic{color:var(--emerald)}
.wchip[aria-selected="true"].done .ic{color:#fff}
.hero{padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.7rem,4.6vw,2.4rem);line-height:1.05;letter-spacing:.005em}
.hero .id-title{color:var(--muted);font-weight:500;margin-top:-4px}
.hero .goal{font-size:.98rem;max-width:60ch}
.hero .goal b{font-weight:700}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-weight:600;font-size:.9rem}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.hero-meta .ic{color:var(--gold)}
.journey{display:flex;flex-direction:column;gap:6px}
.panes{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.pane{height:26px;border:2px solid var(--lead);border-radius:12px 12px 3px 3px;background:var(--surface-2);position:relative;overflow:hidden}
.pane::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--lead);opacity:.55}
.pane.done{background:linear-gradient(135deg,var(--gold) 0 50%,var(--gold-2) 50% 100%)}
.pane.now{background:linear-gradient(135deg,var(--cobalt) 0 50%,var(--cobalt-2) 50% 100%)}
.pane-labels{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pane-labels span{text-align:center;white-space:nowrap}
.mix{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;width:100%;font-weight:400;color:var(--text)}
.mix .mix-ic{width:48px;height:48px;border-radius:14px;border:2px solid var(--lead);display:grid;place-items:center;background:var(--gold);color:var(--on-gold);flex:none}
.mix b{display:block;font-size:1.05rem}
.mix small{color:var(--muted);font-size:.85rem}
.mix .chev{margin-left:auto;color:var(--muted)}
.mix:active{transform:translate(3px,3px);box-shadow:none}
.locknote{padding:16px;display:flex;gap:12px;align-items:center;color:var(--muted);font-weight:500}

.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0 8px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;padding:0;color:var(--text);transform:translateX(var(--x,0));width:150px}
.roundel{position:relative;width:86px;height:86px;border-radius:50%;border:3px solid var(--lead);overflow:hidden;display:grid;place-items:center;
  background:conic-gradient(from 45deg,var(--c1) 0 25%,var(--c2) 0 50%,var(--c1) 0 75%,var(--c2) 0 100%);box-shadow:0 6px 0 var(--lead);transition:transform .12s}
.node-wrap{position:relative;border-radius:50%;box-shadow:0 6px 0 var(--lead)}
.roundel::before,.roundel::after{content:"";position:absolute;left:50%;top:-10%;width:3px;height:120%;margin-left:-1.5px;background:var(--lead);transform:rotate(45deg)}
.roundel::after{transform:rotate(-45deg)}
.boss{position:relative;z-index:1;width:46px;height:46px;border-radius:50%;background:var(--surface);border:3px solid var(--lead);display:grid;place-items:center;color:var(--text)}
.node:active .roundel{transform:translateY(4px);box-shadow:0 2px 0 var(--lead)}
.node.locked .roundel{--c1:var(--stone)!important;--c2:var(--stone-2)!important}
.node.locked{color:var(--muted)}
.nlabel{font-weight:700;font-size:.92rem;line-height:1.15;text-align:center}
.nsub{font-size:.75rem;color:var(--muted);margin-top:-5px;text-align:center}
.nstars{display:flex;gap:2px;margin-top:-2px}
.nstars .ic{color:var(--stone)}
.nstars .on,.badge .on{color:var(--gold)}
.start-tag{position:absolute;top:-34px;left:50%;transform:translateX(-50%);z-index:2;padding:4px 10px;font-family:var(--f-display);font-size:.8rem;letter-spacing:.06em;background:var(--gold);color:var(--on-gold);border:2px solid var(--lead);border-radius:10px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite}
.start-tag::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--lead);border-bottom:0}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.node.next .roundel{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{filter:brightness(1.15) saturate(1.2)}}

.side-card{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.side-card h2{font-size:1rem;font-weight:700}
.goalrow{display:flex;align-items:center;gap:14px}
.goalrow .big{font-family:var(--f-display);font-size:1.6rem;line-height:1}
.verse-text{font-size:1.02rem;line-height:1.55}
.verse-ref{font-weight:700;font-size:.85rem;color:var(--violet)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;font-weight:600;font-size:.88rem}
.bar-track{height:18px;border:2px solid var(--lead);border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;border-right:2px solid var(--lead);transition:width .6s}
.bar-row .val{font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.lead-pill{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--gold);color:var(--on-gold);border:1.5px solid var(--lead);margin-left:6px}

/* ---------- page headings ---------- */
.page{display:flex;flex-direction:column;gap:18px;max-width:780px}
.page-title{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,4vw,2.1rem);line-height:1.1}
.seg{display:inline-flex;border:2px solid var(--lead);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:2px 2px 0 var(--lead);max-width:100%}
.seg button{border:0;background:none;padding:9px 14px;font-weight:600;font-size:.9rem;white-space:nowrap}
.seg button+button{border-left:2px solid var(--lead)}
.seg button[aria-pressed="true"]{background:var(--cobalt);color:#fff}

/* ---------- ranks ---------- */
.rank-list{display:flex;flex-direction:column}
.rank-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:2px solid var(--stone-2)}
.rank-row:first-child{border-top:0}
.rank-row.me{background:var(--surface-2);background:color-mix(in srgb,var(--gold) 22%,var(--surface))}
.rank-no{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:.95rem;border:2px solid var(--lead);background:var(--surface-2)}
.rank-no.m1{background:var(--gold);color:var(--on-gold)}
.rank-no.m2{background:var(--stone-2)}
.rank-no.m3{background:#D9A066;color:#141A3A}
.rank-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-sub{font-size:.8rem;color:var(--muted)}
.rank-xp{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.rank-xp small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.floor-pill{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:99px;border:1.5px solid var(--lead);margin-left:6px;vertical-align:2px;color:#fff}
.demo-note{font-size:.85rem;color:var(--muted);padding:10px 14px;border:2px dashed var(--stone);border-radius:12px}

/* ---------- english day ---------- */
.eday-hero{padding:20px;display:grid;gap:10px;background:linear-gradient(120deg,var(--surface) 0 62%,transparent 62%),conic-gradient(from 45deg at 82% 50%,var(--gold) 0 25%,var(--ruby) 0 50%,var(--cobalt) 0 75%,var(--emerald) 0 100%)}
.eday-hero.today{background:linear-gradient(120deg,var(--gold) 0 62%,transparent 62%),conic-gradient(from 45deg at 82% 50%,var(--ruby) 0 25%,var(--surface) 0 50%,var(--cobalt) 0 75%,var(--surface) 0 100%);color:var(--on-gold)}
.eday-hero.today .muted{color:var(--on-gold);opacity:.8}
.eday-hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.5rem,4.5vw,2.2rem);line-height:1.08;max-width:62%}
.eday-hero p{max-width:60%}
.challenge{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.challenge .ch-text{font-size:1.1rem;font-weight:600}
.talkcard{padding:20px;display:flex;flex-direction:column;gap:14px}
.talkcard .q{font-family:var(--f-display);font-weight:400;font-size:clamp(1.25rem,3.6vw,1.6rem);line-height:1.2}
.starters{display:flex;flex-wrap:wrap;gap:8px}
.starter{border:2px solid var(--lead);border-radius:12px;padding:6px 12px;background:var(--surface-2);font-weight:500;font-size:.92rem;display:inline-flex;gap:6px;align-items:center}
.timer{font-family:var(--f-display);font-size:2rem;font-variant-numeric:tabular-nums;line-height:1}
.timer.run{color:var(--ruby)}

/* ---------- me ---------- */
.profile{padding:18px;display:flex;gap:16px;align-items:center}
.avatar{width:72px;height:72px;flex:none;border-radius:50%;border:3px solid var(--lead);display:grid;place-items:center;position:relative;overflow:hidden;
  background:conic-gradient(from 45deg,var(--cobalt) 0 25%,var(--cobalt-2) 0 50%,var(--cobalt) 0 75%,var(--cobalt-2) 0 100%)}
.avatar span{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;background:var(--surface);border:3px solid var(--lead);display:grid;place-items:center;font-family:var(--f-display);font-size:1.05rem}
.profile h1{font-size:1.3rem;font-weight:700}
.lvlbar{height:14px;border:2px solid var(--lead);border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.lvlbar i{display:block;height:100%;background:var(--gold);border-right:2px solid var(--lead)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{padding:14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--f-display);font-weight:400;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.82rem;color:var(--muted);font-weight:600}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px;padding:16px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.badge .roundel{width:58px;height:58px;box-shadow:0 4px 0 var(--lead)}
.badge .boss{width:30px;height:30px;border-width:2px}
.badge b{font-size:.82rem;line-height:1.15}
.badge small{font-size:.7rem;color:var(--muted);line-height:1.2}
.badge.off .roundel{--c1:var(--stone)!important;--c2:var(--stone-2)!important}
.badge.off b{color:var(--muted)}
.settings{padding:6px 18px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:2px solid var(--stone-2);flex-wrap:wrap}
.set:first-child{border-top:0}
.set label,.set .lbl{font-weight:600}

var CONTR = { "i'm": 'i am', "you're": 'you are', "we're": 'we are', "they're": 'they are', "he's": 'he is', "she's": 'she is', "it's": 'it is',

  "wasn't": 'was not', "shouldn't": 'should not', "couldn't": 'could not', "who's": 'who is', "o'clock": 'oclock' };

  won: 'one', know: 'no', hour: 'our', write: 'right', weak: 'week', ate: 'eight', piece: 'peace', red: 'read', knew: 'new', ok: 'okay',
  rows: 'rose', rode: 'rose', got: 'god', guard: 'god', profit: 'prophet', seam: 'seem', scene: 'seen', bye: 'by', buy: 'by', alter: 'altar', sole: 'soul', reign: 'rain',
  grays: 'grace', graves: 'grace', heel: 'heal', mourning: 'morning', saviour: 'savior', meat: 'meet' };
var ONES = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
var TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function numWord(n) {
  if (n < 20) return ONES[n];
  if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + ONES[n % 10] : '');
  return String(n).split('').map(function (d) { return ONES[+d]; }).join(' ');
}
function normEn(s, strict) {
  s = String(s || '').toLowerCase().replace(/[’‘`´]/g, "'").replace(/(\d+):00\b/g, '$1 oclock').replace(/(\d+):(\d+)/g, '$1 $2');
  s = s.replace(/\bcannot\b/g, 'can not');
  s = s.replace(/[a-z]+'[a-z]+/g, function (m) { return CONTR[m] || m.replace(/'s$/, 's').replace(/'/g, ''); });

}

  if (a === b) return 0;

}

  var eq = strict ? function (a, b) { return a === b; } : eqw;

  for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) dp[i][j] = eq(t[i], h[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);

  var toks = target.split(/\s+/).filter(Boolean), flat = [], owner = [];
  toks.forEach(function (tk, ti) { normEn(tk, strict).forEach(function (w) { flat.push(w); owner.push(ti); }); });
  var best = { score: -1, tokOk: [], heard: '' };
  (alts.length ? alts : ['']).forEach(function (alt) {
    var ok = align(flat, normEn(alt, strict), strict);

    }

/* =====================================================================
   8. ROUNDS (the games)
   ===================================================================== */
var R = null;
var PASS = { write: 0.8, word: 0.75, sentence: 0.7, 'verse-read': 0.7, 'verse-recite': 0.6, talk: 0.6, en2id: 0.6, id2en: 0.6 };

function startRound(week, sk) {
  var W = WEEKS[week - 1], steps = [];
  if (sk === 'match') return startBlitz(week);
  if (sk === 'words') {
    steps = shuffle(W.words).map(function (w) { return { type: 'say', mode: 'word', en: w[0], id: w[1], ex: w[2] }; });
  } else if (sk === 'grammar') {
    steps.push({ type: 'tip' });
    W.gram.q.forEach(function (q) {
      var full = q[0].replace('___', q[1][q[2]]);
      steps.push({ type: 'choice', q: q[0], opts: q[1], a: q[2], full: full });
      steps.push({ type: 'say', mode: 'sentence', en: full, id: '', after: true });
    });
  } else if (sk === 'read') {
    var RD = READS[week - 1];
    steps.push({ type: 'passage' });
    RD.q.forEach(function (q) { steps.push({ type: 'choice', reading: true, skill: 'reading', q: q[0], opts: q[1], a: q[2], full: q[1][q[2]] }); });
    shuffle(W.says).slice(0, 4).forEach(function (x, i) { steps.push({ type: 'write', mode: 'write', en: x[0], id: x[1], dict: i % 2 === 0 }); });
  } else if (sk === 'speak') {
    steps = W.says.map(function (s) { return { type: 'say', mode: 'sentence', en: s[0], id: s[1] }; });
  } else if (sk === 'verse') {
    steps = [{ type: 'say', mode: 'verse-read', en: W.verse.en, id: W.verse.id, ref: W.verse.ref },
             { type: 'order', en: W.verse.en, ref: W.verse.ref },
             { type: 'say', mode: 'verse-recite', en: W.verse.en, id: W.verse.id, ref: W.verse.ref }];
  } else if (sk === 'talk') {
    var hide = starsOf(week, 'talk') >= 2;
    steps = W.talk.lines.map(function (l) { return l[0] === 'A' ? { type: 'partner', en: l[1], id: l[2] } : { type: 'say', mode: 'talk', en: l[1], id: l[2], hideEn: hide }; });
  } else if (sk === 'interp') {
    steps = W.interp.map(function (it, i) { return i % 2 === 0 ? { type: 'say', mode: 'en2id', en: it[0], id: it[1], keys: it[2] } : { type: 'say', mode: 'id2en', en: it[0], id: it[1] }; });
  }
  R = { week: week, sk: sk, steps: steps, i: 0, scores: [], combo: 0, maxCombo: 0, xp: 0, recite: 0 };
  openGame();
  renderStep();
}
function startMix() {
  var pool = [];
  for (var w = 1; w <= 8; w++) if (weekUnlocked(w)) WEEKS[w - 1].words.forEach(function (x) { pool.push(x); });
  var ranked = shuffle(pool).sort(function (a, b) { return (S.prog.words[a[0].toLowerCase()] || 0) - (S.prog.words[b[0].toLowerCase()] || 0); }).slice(0, 8);
  var steps = ranked.map(function (x, i) {
    if (i % 2 === 0) {
      var others = shuffle(pool.filter(function (p) { return p[0] !== x[0]; })).slice(0, 3).map(function (p) { return p[0]; });
      var opts = shuffle(others.concat([x[0]]));
      return { type: 'choice', prompt: 'Which English word means…', q: x[1], opts: opts, a: opts.indexOf(x[0]), full: x[2], word: x[0] };
    }
    return { type: 'say', mode: 'word', en: x[0], id: x[1], ex: x[2] };
  });
  R = { week: 0, sk: 'mix', mix: true, steps: steps, i: 0, scores: [], combo: 0, maxCombo: 0, xp: 0 };
  openGame();
  renderStep();
}

function openGame() {
  $('#game').hidden = false;
  document.body.style.overflow = 'hidden';
  $('#g-prog').classList.remove('timer');
  $('#g-close').innerHTML = icon('x', 22);
}
function closeGame() {
  if (!R) { $('#game').hidden = true; return; }
  STT.abort(); TTS.cancel();
  if (R.raf) cancelAnimationFrame(R.raf);
  clearTimeout(R.autoT);
  R = null;
  closeSheet();
  $('#game').hidden = true;
  document.body.style.overflow = '';
  renderAll();
  if (S.pendingLevel) showLevelUp();
}

function setProgress() {
  $('#g-bar').style.width = (R.i / R.steps.length * 100) + '%';
  $('#g-combo').innerHTML = R.combo >= 2 ? icon('flame', 18) + '×' + R.combo : '';
}

function renderStep() {
  closeSheet();
  STT.abort();
  S.seq = (S.seq || 0) + 1; TTS.cancel();
  clearTimeout(R.autoT);
  if (R.i >= R.steps.length) return finishRound();
  setProgress();
  var st = R.steps[R.i];
  R.tries = 0; R.best = null; R.peek = false; R.answered = false; R.listening = false; R.selfOnly = false;
  if (st.type === 'tip') rTip();
  else if (st.type === 'passage') rPassage();
  else if (st.type === 'write') rWrite(st);
  else if (st.type === 'say') rSay(st, false);
  else if (st.type === 'choice') rChoice(st);
  else if (st.type === 'order') rOrder(st);
  else if (st.type === 'partner') rPartner(st);
  if (st.coach) {
    var tip = typeof st.coach === 'string' ? st.coach : st.coach[voiceMode() === 'voice' ? 0 : 1];
    $('#g-body').insertAdjacentHTML('afterbegin', '<div class="coach">' + icon('bulb', 20) + '<p>' + esc(tip) + '</p></div>');
  }
}

function nextBlitzQ() {

  $('#g-actions').innerHTML = '<div class="opts grid2">' + opts.map(function (o, i) { return '<button class="opt" data-g="bopt" data-i="' + i + '"><kbd>' + (i + 1) + '</kbd>' + esc(o) + '</button>'; }).join('') + '</div>';

/* ---------- end of a round ---------- */
function finishRound(forcedStars, note) {
  if (R.tutorial) return finishTutorial();
  STT.abort(); TTS.cancel();
  $('#g-bar').style.width = '100%';
  var sc = R.scores, acc = sc.length ? sc.reduce(function (a, b) { return a + b; }, 0) / sc.length : 1;
  var stars = forcedStars || (acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : 1);
  var bonus = 0, first = false;
  if (!R.mix) {
    var key = R.week + '-' + R.sk;
    first = !(S.prog.stars[key] > 0);
    S.prog.stars[key] = Math.max(S.prog.stars[key] || 0, stars);
    bonus = 10 + stars * 5 + (first ? 20 : 0);
    if (R.sk === 'talk') S.prog.talks = (S.prog.talks || 0) + 1;
    if (R.sk === 'verse') S.prog.verses[String(R.week)] = Math.max(S.prog.verses[String(R.week)] || 0, Math.round(R.recite * 100));
    if (acc >= 0.999 && sc.length >= 3 && !R.blitz) award('perfect');
    var sks = R.sks || {};
    if (R.blitz && R.correct + R.wrong > 0) sks = { vocab: [R.correct, R.correct + R.wrong] };
    for (var sk2 in sks) { var kk = R.week + '-' + sk2, v2 = Math.round(sks[sk2][0] / sks[sk2][1] * 100); S.prog.skill[kk] = kk in S.prog.skill ? Math.max(S.prog.skill[kk], v2) : v2; }
  } else bonus = 15;
  R.xp += addXP(bonus, true);
  R.gift = Math.random() < 0.35 ? 10 + 5 * Math.floor(Math.random() * 5) : 0;
  checkBadges();
  pushSave();

  var titles = R.mix ? ['Review done!', 'Review done!', 'Review done!', 'Review done!'] : ['', 'Good start!', 'Well done!', 'Wonderful!'];
  var starsHtml = R.mix ? '' : '<div class="bigstars">' + [1, 2, 3].map(function (n) {
    return '<svg viewBox="0 0 24 24" class="' + (n <= stars ? 's-on' : 's-off') + '"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
  }).join('') + '</div>';
  var label = R.mix ? 'Daily Mix' : 'Week ' + R.week + ' · ' + STATIONS.filter(function (s) { return s.k === R.sk; })[0].name;
  $('#g-body').innerHTML = '<div class="result center">' + starsHtml + '<span class="eyebrow">' + esc(label) + '</span><h2>' + titles[stars] + '</h2>' +
    (note ? '<p><b>' + esc(note) + '</b></p>' : '') + (first ? '<p class="muted">First clear bonus +' + (isEDay() ? 40 : 20) + ' XP</p>' : '') +
    '<div class="rstats"><div class="card rstat"><b>' + (R.blitz ? R.correct : Math.round(acc * 100) + '%') + '</b><span>' + (R.blitz ? 'Correct' : 'Accuracy') + '</span></div>' +
    '<div class="card rstat"><b>+' + R.xp + '</b><span>XP earned</span></div><div class="card rstat"><b>×' + R.maxCombo + '</b><span>Best combo</span></div></div>' +
    (R.gift ? '<button class="card gift" data-g="gift">' + icon('gift', 26) + '<span>A blessing bonus! Tap to open</span></button>' : '') + '</div>';
  var nxt = nextStation();
  $('#g-actions').innerHTML = (nxt ? '<button class="btn primary wide" data-g="go-next">' + esc(nxt.label) + ' ' + icon('chev') + '</button>' : '') +
    '<div class="row"><button class="btn" data-g="again">' + icon('refresh') + 'Play again</button><button class="btn" data-g="close">Back to the path</button></div>';
  if (stars === 3 || R.mix) { confetti(); SFX.level(); } else SFX.gift();
  if (S.pendingLevel) setTimeout(showLevelUp, 1400);
}
function nextStation() {
  if (!R || R.mix) return null;

  for (var j = idx + 1; j < STATIONS.length; j++) if (!(starsOf(R.week, STATIONS[j].k) > 0)) return { w: R.week, k: STATIONS[j].k, label: 'Next: ' + STATIONS[j].name };
  if (idx + 1 < STATIONS.length) return { w: R.week, k: STATIONS[idx + 1].k, label: 'Next: ' + STATIONS[idx + 1].name };
  if (R.week < 8 && weekUnlocked(R.week + 1)) return { w: R.week + 1, k: 'words', label: 'Start Week ' + (R.week + 1) };
  return null;
}

  S.prog.daily[k] = prev + amt;
  if (prev < S.config.dailyGoal && prev + amt >= S.config.dailyGoal) setTimeout(function () { toast('Daily goal reached! Keep the fire burning.'); }, 600);
  if (isEDay() && prev + amt >= 100) award('eday');

function confetti() {

  var cv = $('#confetti'), ctx = cv.getContext('2d'); if (!ctx) return;
  var W = window.innerWidth, H = window.innerHeight, dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); cv.hidden = false;
  var cs = getComputedStyle(document.documentElement);
  var cols = ['--cobalt', '--ruby', '--gold', '--emerald', '--sky', '--violet'].map(function (v) { return cs.getPropertyValue(v).trim() || '#f2b400'; });
  var lead = cs.getPropertyValue('--lead').trim() || '#141a3a';
  var parts = []; for (var i = 0; i < 90; i++) parts.push({ x: W / 2 + (Math.random() - 0.5) * W * 0.5, y: H * 0.4, vx: (Math.random() - 0.5) * 11, vy: -Math.random() * 12 - 4, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, s: 7 + Math.random() * 9, c: cols[i % cols.length], n: 3 + (i % 2) });
  var t0 = performance.now();
  var frame = function (t) {
    ctx.clearRect(0, 0, W, H);
    parts.forEach(function (p) {
      p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.beginPath();
      for (var k = 0; k < p.n; k++) { var a = k / p.n * Math.PI * 2; ctx.lineTo(Math.cos(a) * p.s, Math.sin(a) * p.s * 0.7); }
      ctx.closePath(); ctx.fillStyle = p.c; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = lead; ctx.stroke(); ctx.restore();
    });
    if (t - t0 < 2600) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
  };

}

function onLogin(e) {

    var extra = PLAT === 'android' ? 'Still blocked? Phone Settings → Apps → Chrome → Permissions → Microphone → Allow.'

      : 'Windows: Settings → Privacy &amp; security → Microphone. Mac: System Settings → Privacy &amp; Security → Microphone. Let your browser use it.';
    return head() + bad('The microphone is blocked for this page.') + hSteps(d) + '<p class="hint">' + extra + '</p>' +
      '<div class="h-actions">' + tryBtn + '<button class="btn" data-h="reload">' + icon('refresh', 16) + 'Reload page</button>' + later + '</div>';
  }
  if (ms === 'service') {
    var sv = PLAT === 'ios'
      ? [['Open this page in <b>Safari</b>', 'not Chrome, not inside another app, not from a Home Screen icon'], ['Turn on <b>Siri</b>', 'Settings → Siri (or Apple Intelligence &amp; Siri)'], ['Turn on <b>Dictation</b>', 'Settings → General → Keyboard → Enable Dictation'], ['Come back, reload the page and try again', '']]
      : PLAT === 'android'
      ? [['Use <b>Google Chrome</b>', ''], ['Update the <b>Google</b> app in the Play Store', 'it does the voice checking'], ['Let the Google app use the microphone', 'Settings → Apps → Google → Permissions → Microphone → Allow'], ['Come back and try again', '']]
      : [['Use <b>Chrome</b> or <b>Edge</b>', ''], ['Check your internet connection', 'voice checking runs online'], ['Try again', '']];
    return head() + bad('Voice checking is turned off on this device.') + hSteps(sv) + '<div class="h-actions">' + tryBtn + '<button class="btn" data-h="reload">' + icon('refresh', 16) + 'Reload page</button>' + later + '</div>';
  }
  if (ms === 'nomic') {
    return head() + bad('No microphone found, or another app is using it.') + hTips(['Close other apps that use the microphone: a call, a WhatsApp voice note, Zoom or Meet.', 'Using Bluetooth earbuds? Try without them.', 'Laptop: pick the right microphone in your sound settings.']) +
      '<div class="h-actions">' + tryBtn + later + '</div>';
  }
  if (ms === 'network') {
    return head() + bad('The voice checking service can’t be reached.') + hTips(['Check your Wi-Fi or mobile data.', 'Voice checking needs the internet.']) + '<div class="h-actions">' + tryBtn + later + '</div>';
  }
  if (ms === 'env') {
    var st, msg, why = '';
    if (S.env === 'iosother') {
      msg = 'On iPhone, voice checking only works in Safari.';
      why = '<p class="hint">Chrome, Edge and Firefox on iPhone can’t use Apple’s speech service, even when the microphone is allowed. That’s why no question appeared.</p>';
      st = [['Tap <b>Copy link</b> below', ''], ['Open <b>Safari</b>', 'the blue compass app'], ['Paste the link in the address bar and tap <b>Go</b>', 'sign in with the same name and PIN; your progress is saved']];
    } else if (S.env === 'standalone') {
      msg = 'The microphone doesn’t work from the Home Screen icon.';
      st = [['Tap <b>Copy link</b> below', ''], ['Open <b>Safari</b> and paste it in the address bar', 'On iPhone, voice checking doesn’t work from a Home Screen icon']];
    } else {
      msg = 'This page is open inside another app, where the microphone doesn’t work.';
      st = [['Tap the menu of this app’s browser', 'often ⋮ or ··· in a corner'], ['Choose <b>Open in ' + browserName() + '</b>', 'or copy the link below and paste it in ' + browserName()]];
    }
    return head() + bad(msg) + why + hSteps(st) +
      '<div class="h-actions"><button class="btn primary" data-h="copy">' + icon('copy', 16) + 'Copy link</button>' + (S.env === 'iosother' ? '' : '<button class="link" data-h="mic-go">Try anyway</button>') + later + '</div>';
  }
  if (ms === 'stuck') {
    var tips = PLAT === 'ios'
      ? ['Use <b>Safari</b>: other iPhone browsers can’t check your voice.', 'Turn on Siri and Dictation: Settings → General → Keyboard → Enable Dictation.', 'Reload the page and try again.']
      : PLAT === 'android'
      ? ['Use <b>Google Chrome</b>, updated in the Play Store.', 'Check the microphone is allowed: tap the icon left of the web address → Permissions.', 'Reload the page and try again.']
      : ['Use <b>Chrome</b> or <b>Edge</b>.', 'Check the microphone is allowed: click the icon left of the web address.', 'Reload the page and try again.'];
    return head() + bad('Your browser didn’t respond.') + hTips(tips) +
      '<div class="h-actions">' + tryBtn + '<button class="btn" data-h="reload">' + icon('refresh', 16) + 'Reload page</button>' + later + '</div>';
  }
  if (ms === 'unsupported') {
    return head() + bad('This browser can’t check your voice.') + hTips(['Android: Google Chrome', 'iPhone: Safari', 'Laptop: Chrome or Edge']) + '<div class="h-actions">' + copy + later + '</div>';
  }
  // frame: the Apps Script link blocks the microphone
  return head() + bad('This link can’t use the microphone.') + '<p>Google blocks the microphone on Apps Script pages. ' + (vu ? 'Open the voice version instead; your progress stays the same.' : 'Ask your coordinator for the voice version link.') + '</p>' +
    '<div class="h-actions">' + (vu ? '<a class="btn primary" href="' + esc(vu) + '" target="_top" rel="noopener">Open the voice version</a>' : '') + later + '</div>';
}
function hPractice() {
  return hArt([['ruby', 'ruby-2', 'mic'], ['emerald', 'emerald-2', 'grid'], ['cobalt', 'gold', 'pen']]) +
    '<h2 id="h-title">Try a 1-minute practice</h2><p class="h-id">Latihan singkat</p>' +
    '<p>A tiny lesson to learn the buttons: say a word, pick an answer, type what you hear, and say a sentence. You can’t get it wrong.</p>' +
    '<div class="h-actions"><button class="btn primary" data-h="practice">' + icon('play', 18) + 'Start practice</button><button class="link" data-h="done">Skip, go to the path</button></div>';
}
function helpMicTest() {
  TTS.cancel();
  HELP.ms = 'listen'; HELP.heard = '';
  var tok = HELP.tok = (HELP.tok || 0) + 1;
  var p = STT.listen('en-US', function (t) { if (!HELP || HELP.tok !== tok) return; HELP.heard = t; var l = $('#h-live'); if (l) l.textContent = t; }); // starts inside the tap
  renderHelp();
  setTimeout(function () {
    if (!HELP || HELP.tok !== tok || HELP.ms !== 'listen' || HELP.heard) return;
    var l = $('#h-live'); if (l) l.innerHTML = 'Nothing happening? <button class="link" data-h="mic-stuck">Get help</button>';
  }, 6000);
  p.then(function (r) {
    if (!HELP || HELP.tok !== tok) return;
    if (r.error) HELP.ms = micErrState(r.error);
    else if (!r.alts.length) HELP.ms = 'noheard';
    else { HELP.ms = 'ok'; HELP.heard = r.alts[0]; S.mic = 'ok'; }
    if (HELP.flow[HELP.i] === 'mic') renderHelp();
    if (HELP.ms === 'ok') SFX.ok(0);
  });
}
function onHelp(k) {
  if (!HELP) return;
  if (k === 'close' || k === 'done') { closeHelp(); return; }
  if (k === 'next' || k === 'next-skip') { HELP.tok = (HELP.tok || 0) + 1; STT.abort(); HELP.i = Math.min(HELP.i + 1, HELP.flow.length - 1); HELP.ss = 'intro'; HELP.ms = initialMicState(); renderHelp(); try { $('#help').scrollTop = 0; } catch (e) { } return; }
  if (k === 'play') { SFX.unlock(); SFX.gift(); TTS.speak('Welcome to English Day! God bless you.'); if (HELP.ss === 'intro') { HELP.ss = 'played'; renderHelp(); } return; }
  if (k === 'sound-yes') { HELP.ss = 'yes'; renderHelp(); return; }
  if (k === 'sound-no') { HELP.ss = 'tips'; renderHelp(); return; }
  if (k === 'mic-go') { helpMicTest(); return; }
  if (k === 'mic-stop') { STT.stop(); return; }
  if (k === 'mic-stuck') { HELP.tok = (HELP.tok || 0) + 1; STT.abort(); HELP.ms = S.env === 'iosother' ? 'env' : 'stuck'; renderHelp(); return; }
  if (k === 'mic-skip') {
    STT.abort();
    if (S.mic !== 'ok' && S.mic !== 'frame') S.mic = ['env', 'unsupported'].indexOf(S.mic) >= 0 ? S.mic : 'off';
    if (HELP.i < HELP.flow.length - 1) { HELP.i++; renderHelp(); } else closeHelp();
    return;
  }
  if (k === 'reload') { try { location.reload(); } catch (e) { } return; }
  if (k === 'copy') { copyText(shareUrl()); return; }
  if (k === 'practice') { closeHelp(); startTutorial(); return; }
}

/* =====================================================================
   10. EVENTS
   ===================================================================== */
function go(tab) { S.view = tab; S.signoutArm = false; renderTabs(); renderView(); try { window.scrollTo(0, 0); } catch (e) { } }

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-tab]');
  if (t && t.classList.contains('tab')) { go(t.dataset.tab); return; }
  var m = e.target.closest('[data-m]');
  if (m) { $('#modal').hidden = true; return; }
  var h = e.target.closest('[data-h]');
  if (h) { onHelp(h.dataset.h); return; }
  var a = e.target.closest('[data-act]');
  if (a) return onAct(a);
  var g = e.target.closest('[data-g]');
  if (g) return onGame(g);
});
function onAct(a) {
  var act = a.dataset.act;
  if (act === 'home') { $('#modal').hidden = true; S.week = defaultWeek(); go('learn'); return; }
  if (act === 'copy-link') { copyText(shareUrl()); return; }
  if (act === 'tour') { openHelp(['welcome', 'sound', 'mic', 'practice'], { tour: true }); return; }
  if (act === 'check') { openHelp(['sound', 'mic'], {}); return; }
  if (act === 'week') { var w = +a.dataset.w; if (!weekUnlocked(w)) { toast('Finish 5 stations in Week ' + (w - 1) + ' to unlock Week ' + w + '.'); } S.week = w; renderLearn(); }
  else if (act === 'station') { if (!weekUnlocked(S.week)) { toast('This week is still locked.'); return; } startRound(S.week, a.dataset.k); }
  else if (act === 'mix') startMix();
  else if (act === 'tab') go(a.dataset.tab);
  else if (act === 'hear-verse') TTS.speak(WEEKS[S.week - 1].verse.en);
  else if (act === 'rank') { S.rankTab = a.dataset.r; renderRanks(); }
  else if (act === 'refresh') { S.board = API.mode === 'local' ? demoBoard() : S.board; refreshBoard(); toast('Refreshing scores…'); }
  else if (act === 'challenge') { var ws = weekStartKey(); if (!S.prog.challenges[ws]) { S.prog.challenges[ws] = true; addXP(30); confetti(); SFX.gift(); renderEday(); } }
  else if (act === 'clevel') { S.cardLevel = a.dataset.l; S.card = null; renderEday(); }
  else if (act === 'card-next') { var n = CARDS[S.cardLevel].length, i = S.card ? S.card.i : 0; S.card = { level: S.cardLevel, i: (i + 1 + Math.floor(Math.random() * (n - 1))) % n, done: false }; renderEday(); }
  else if (act === 'card-hear') TTS.speak(CARDS[S.cardLevel][S.card.i][0]);
  else if (act === 'say-starter') TTS.speak(a.dataset.t.replace(/…/g, ''));
  else if (act === 'card-timer') toggleTimer();
  else if (act === 'card-done') { var k = dkey(); if ((S.prog.cards[k] || 0) < 6 && !S.card.done) { S.prog.cards[k] = (S.prog.cards[k] || 0) + 1; S.card.done = true; addXP(15); SFX.ok(0); renderEday(); } }
  else if (act === 'signout') {
    if (!S.signoutArm) { S.signoutArm = true; renderMe(); return; }
    S.profile = null; S.prog = defaultProg(); S.tests = []; S.unlock = 0; S.signoutArm = false; persist(); S.board = null; S.week = 1; go('learn'); renderHeader(); showLogin();
  }
}
function onGame(g) {
  if (!R && g.dataset.g !== 'close') return;
  var k = g.dataset.g, st = R ? R.steps[R.i] : null;
  switch (k) {
    case 'close': closeGame(); break;
    case 'next-tip': R.i++; renderStep(); break;
    case 'mic': onMic(); break;
    case 'self': onSelf(); break;
    case 'rate': onRate(parseFloat(g.dataset.v)); break;
    case 'retry': if (st && st.type === 'write') { closeSheet(); var wi = $('#w-in'); if (wi) { wi.focus(); wi.select(); } break; }
      closeSheet(); var l = $('#live'); if (l) { l.classList.remove('hearing'); l.textContent = 'Tap the mic and try again'; } speakTarget(st, true); break;
    case 'next': commit(); break;
    case 'skip': skipStep(); break;
    case 'skip-partner': TTS.cancel(); clearTimeout(R.autoT); R.i++; renderStep(); break;
    case 'hear': if (st && st.type === 'partner') TTS.speak(st.en, { alt: true, pitch: 1.08 }); else if (st) speakTarget(st, false); break;
    case 'slow': if (st) speakTarget(st, true); break;
    case 'hear-ex': TTS.speak(st.ex); break;
    case 'hear-passage': speakPassage(READS[R.week - 1].text); break;
    case 'hear-id': TTS.speak(st.id, { lang: 'id-ID' }); break;
    case 'hear-full': TTS.speak(st.word ? st.word + '. ' + st.full : st.full); break;
    case 'peek': R.peek = true; rSay(st, true); if (st.mode === 'talk' || st.mode === 'en2id') speakTarget(st, false); break;
    case 'opt': onOpt(+g.dataset.i); break;
    case 'chunk': onChunk(g); break;
    case 'blitz-go': blitzGo(); break;
    case 'bopt': onBlitz(+g.dataset.i); break;
    case 'gift':
      if (g.classList.contains('opened')) break;
      var amt = addXP(R.gift, true); R.xp += amt; pushSave();
      g.classList.add('opened'); g.innerHTML = icon('gift', 26) + '<span>Blessing bonus: +' + amt + ' XP</span>';
      SFX.gift(); confetti();
      var xs = document.querySelectorAll('.rstat b')[1]; if (xs) xs.textContent = '+' + R.xp;
      break;
    case 'again': var wk = R.week, sk = R.sk, mx = R.mix; R = null; closeSheet(); if (mx) startMix(); else startRound(wk, sk); break;
    case 'go-next': var nx = nextStation(); R = null; if (nx) { S.week = nx.w; startRound(nx.w, nx.k); } break;
    case 'tut-start': var fl = firstLesson(); R = null; closeSheet(); S.week = fl.w; startRound(fl.w, fl.k); break;
    case 'fixmic': STT.abort(); if (R) R.listening = false; openHelp(['mic'], { from: 'lesson' }); break;
  }
}
document.addEventListener('keydown', function (e) {
  if (!$('#help').hidden) { if (e.key === 'Escape') closeHelp(); return; }
  if ($('#game').hidden) return;
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  var onButton = tag === 'button';
  var sheetOpen = $('#sheet').className.indexOf('open') >= 0;
  if (e.key === 'Escape') { closeGame(); return; }
  if (e.key === 'Enter' && !onButton) { var b = sheetOpen ? $('#sheet [data-g="next"]') : $('#g-actions .btn.primary, #g-actions .btn.gold'); if (b) { e.preventDefault(); b.click(); } }
  else if (e.key === ' ' && !onButton && !sheetOpen) { var mc = $('#mic'); if (mc) { e.preventDefault(); mc.click(); } }
  else if (/^[1-4]$/.test(e.key) && !sheetOpen) { var o = $('#g-actions [data-i="' + (+e.key - 1) + '"]'); if (o) o.click(); }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 's-rate') { S.settings.rate = parseFloat(e.target.value); persist(); }
});
document.addEventListener('change', function (e) {
  var id = e.target.id;
  if (id === 's-rate') TTS.speak('God is good all the time.');
  else if (id === 's-voice') { S.settings.voiceURI = e.target.value; persist(); TTS.speak('Welcome to English Day.'); }
  else if (id === 's-sfx') { S.settings.sfx = e.target.checked; persist(); if (S.settings.sfx) SFX.ok(0); }
});
$('#login-form').addEventListener('submit', onLogin);
document.addEventListener('submit', function (e) { if (e.target && e.target.id === 'w-form') { e.preventDefault(); onWrite(); } });
document.addEventListener('visibilitychange', function () { if (!document.hidden) { renderHeader(); if (S.view === 'ranks') refreshBoard(); } });

/* =====================================================================
   11. START
   ===================================================================== */
function init() {
  load();
  try { applyCfg(JSON.parse(localStorage.getItem(CFG_KEY) || 'null')); } catch (e) { }
  API.init();
  TTS.init();
  S.env = envIssue();
  if (S.env === 'inapp' || S.env === 'standalone' || S.env === 'iosother') S.mic = 'env'; // iPhone: only Safari can check voices
  else if (!STT.Ctor) S.mic = 'unsupported';
  ['touchend', 'click', 'keydown'].forEach(function (ev) { document.addEventListener(ev, unlockAudio, true); });
  try {
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'microphone' }).then(function (p) {
        S.micPerm = p.state;
        p.onchange = function () { S.micPerm = p.state; if (p.state === 'granted' && S.mic === 'denied') S.mic = 'unknown'; };
      }).catch(function () { });
    }
  } catch (e) { }
  document.querySelectorAll('.tab').forEach(function (t) { t.insertAdjacentHTML('afterbegin', icon(t.dataset.icon, 22)); });
  S.week = defaultWeek();
  S.board = API.mode === 'local' ? demoBoard() : null;
  renderAll();
  if (!S.profile) showLogin();
  else if (API.mode === 'local') maybeTour();
  if (API.mode !== 'local') {
    API.call('getConfig').then(function (c) {
      applyCfg(c); S.configErr = '';
      try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) { }
      if (!S.profile) showLogin();
      renderAll();
    }).catch(function (e) {
      S.configErr = e.message;
      if (!S.profile) showLogin();
    });
    refreshBoard();
    syncDown();
  }
}
init();
})();
</script>
